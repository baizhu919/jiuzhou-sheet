<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>九洲 · 非凡者档案</title>
<link rel="stylesheet" href="style.css?v=46">
</head><body>
<header><div class="bar">
  <div class="brand">九 洲<small>非凡者档案 · 第五纪 元历 320 年</small></div>
  <div class="who"><span class="who-label">角色</span><span id="curName">未命名</span></div>
  <button id="btnSlots">存档</button>
  <a class="btnlink" href="rules.html">规则速查</a>
  <div class="spacer"></div>
  <span id="saveState" class="hint"></span>
  <button id="btnShare">分享链接</button>
  <button id="btnExport">导出 JSON</button>
  <button id="btnImport">导入</button>
  <input id="fileInput" type="file" accept="application/json" hidden>
  <button id="btnPrint">打印 / PDF</button>
  <button id="btnReset">清空</button>
</div></header>

<main>
  <section>
    <h2><span class="no">①</span>身份</h2>
    <div class="row two">
      <label>姓名<input data-k="name" placeholder="姓名"></label>
      <label>称号<input data-k="title" placeholder="称号"></label>
      <label>性别<input data-k="gender" placeholder="性别"></label>
      <label>年龄<input data-k="age" placeholder="年龄"></label>
      <label>出身<input data-k="origin" id="originInput" list="originList" placeholder="可自定义，如「码头帮工」"><datalist id="originList"></datalist></label>
      <label>所属<input data-k="faction" placeholder="家族 / 教会 / 机构"></label>
      <label>所在洲<select data-k="continent" id="selContinent"></select></label>
      <label>信仰<input data-k="faith" placeholder="信仰"></label>
    </div>
    
  </section>

  <section>
    <h2><span class="no">②</span>途径与位格</h2>
    <div class="row two">
      <label>途径<select data-k="path" id="selPath"></select></label>
      <label>序列<select data-k="seq" id="selSeq"></select></label>
      <label>位格<input id="outTier" readonly></label>
      <label>属性上限<input id="outCap" readonly></label>
      <label>途径强度<input id="outPower" readonly></label>
      <label>标签数<input id="outTags" readonly></label>
      <label>污染<input data-k="pollution" type="number" placeholder="0"></label>
      <label>消化进度<input data-k="digest" type="number" min="0" max="100" placeholder="0 / 100" title="0 到 100，满 100 消化完毕"></label>
    </div>
    <p class="hint" id="seqName"></p>
  </section>

  <section>
    <h2><span class="no">③</span>属性<span class="pill" id="attrLeft">剩 9 点</span></h2>
    <div class="row">
      <label>体魄<input data-k="attr.body" type="number" min="1" max="5" value="3"></label>
      <label>智慧<input data-k="attr.wits" type="number" min="1" max="5" value="3"></label>
      <label>心魂<input data-k="attr.soul" type="number" min="1" max="5" value="3"></label>
      <label>加点池<input id="outPool" readonly></label>
    </div>
    <table style="margin-top:10px"><thead><tr><th class="l">属性</th><th>值</th><th>强度</th><th>上限</th></tr></thead>
    <tbody id="attrBody"></tbody></table>
  </section>

  <section>
    <h2><span class="no">④</span>状态</h2>
    <div class="row">
      <label>生命值<input id="outLife" readonly></label>
      <label>已扣<input data-k="lifeLost" type="number" min="0" value="0"></label>
      <label>闪避<input id="outEvasion" readonly></label>
      <label>护甲<select data-k="armor" id="selArmor"></select></label>
      <label>护甲耐久<input data-k="armorDur" type="number" min="0" value="0"></label>
      <label>阈值（中伤 / 重伤）<input id="outThresh" readonly></label>
      <label>灵性上限<input id="outSpirit" readonly></label>
      <label>失控值<input data-k="loss" type="number" value="0"></label>
      <label>失控上限<input id="outLossMax" readonly></label>
      <label>时髦值<input data-k="vogue" type="number" value="10"></label>
      <label>道具点<input data-k="props" type="number" value="0"></label>
      <label>护甲备注<input data-k="armorNote" placeholder="盾牌 / 抗性"></label>
    </div>
  </section>

  <section class="wide">
    <h2><span class="no">⑤</span>技能<span class="pill" id="skillLeft">剩余加点 0</span></h2>
    <div class="skillwrap">
      <table><thead><tr><th class="l">技能</th><th>属性</th><th>初始</th><th>成长</th><th>加点</th><th>合计</th></tr></thead><tbody id="skillBody"></tbody></table>
      <table><thead><tr><th class="l">技能</th><th>属性</th><th>初始</th><th>成长</th><th>加点</th><th>合计</th></tr></thead><tbody id="skillBody2"></tbody></table>
    </div>
    <p class="hint">技能点池 ＝ 体魄 ＋ 智慧；初始为 0；合计自动算。</p>
  </section>

  <section class="wide">
    <h2><span class="no">⑥</span>非凡能力<span class="pill" id="abilCount">0</span></h2>
    <div id="abilityList"><p class="hint">先在 ② 选途径与序列。</p></div>
  </section>

  <section>
    <h2><span class="no">⑦</span>能力或特性</h2>
    <textarea data-k="myAbilities" placeholder="把⑥里的能力名抄到这里，并写清楚用法。"></textarea>
  </section>

  <section>
    <h2><span class="no">⑧</span>武器</h2>
    <div id="weaponList"></div>
    <div class="tools"><button id="addWeapon">+ 添加</button></div>
  </section>

  <section>
    <h2><span class="no">⑨</span>装备与封印物</h2>
    <div id="equipList"></div>
    <div class="tools"><button id="addEquip">+ 添加</button></div>
  </section>

  <section>
    <h2><span class="no">⑩</span>物品栏</h2>
    <div id="invList"></div>
    <div class="tools"><button id="addInv">+ 添加</button></div>
  </section>

  <section>
    <h2><span class="no">⑪</span>关系与线索</h2>
    <div id="relList"></div>
    <div class="tools"><button id="addRel">+ 添加</button></div>
  </section>

  <section>
    <h2><span class="no">⑫</span>驯养记录</h2>
    <div id="beastList"></div>
    <div class="tools"><button id="addBeast">+ 添加</button></div>
  </section>

  <section>
    <h2><span class="no">⑬</span>角色简介</h2>
    <textarea data-k="profile.desc" style="min-height:140px" placeholder="写下对您角色的概括性介绍，包括他们的过去、经历和个性特征。请注意，角色真正的性格和背景特质应当在游戏中体现出来，这里只是简短的概括和提示。"></textarea>
  </section>

  <section>
    <h2><span class="no">⑭</span>角色特质</h2>
    <textarea data-k="profile.traits" style="min-height:140px" placeholder="写下您角色的性别、年龄、外貌和服装等外观特征。如果您的角色有什么特征或者与众不同之处，也可以记录在这里。"></textarea>
  </section>

  <section class="wide">
    <h2><span class="no">⑮</span>冒险笔记</h2>
    <textarea data-k="profile.notes" style="min-height:170px" placeholder="写下您角色经历的重大事件，值得注意的线索，目前角色的状态和思考，或者其他值得记录的重要信息。"></textarea>
  </section>
</main>
<footer>数据存于本机浏览器；导出 JSON 或分享链接可带走。规则：九洲 TRPG · 元历 320 年。</footer>
<div class="toast" id="toast"></div>
<div id="slotModal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head"><span>存档</span><button id="slotClose">×</button></div>
    <div id="slotList" class="slot-list"></div>
    <div class="modal-foot">
      <button id="btnNew">新建</button>
      <button id="btnDup">复制当前</button>
      <button id="btnRen">重命名</button>
      <button id="btnDel">删除当前</button>
    </div>
  </div>
</div>
<datalist id="raceList"></datalist>
<script src="data.js?v=46"></script>
<script src="app.js?v=46"></script>
</body></html>
